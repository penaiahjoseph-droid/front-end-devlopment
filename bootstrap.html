<!DOCTYPE html>
<html>
<head>
    <title>Bootstrap Component</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">My digital world</a>
        </div>
    </nav>

    <div class="container mt-4">

        <div class="alert alert-success" role="alert">
            Welcome to Bootstrap Components Page!
        </div>

        <div class="card" style="width: 18rem;">
            <img src="https://in.images.search.yahoo.com/images/view;_ylt=Awrx.LMvBx1qsjQWCji9HAx.;_ylu=c2VjA3NyBHNsawNpbWcEb2lkAzlmYjRkOGU1M2FhZjA0OWE3YzkyNzQxYmM1MDJhNWU3BGdwb3MDMTcEaXQDYmluZw--?back=https%3A%2F%2Fin.images.search.yahoo.com%2Fsearch%2Fimages%3Fp%3Dtechnical%2Bimages%26ei%3DUTF-8%26type%3DE210IN1589G0%26fr%3Dmcafee%26fr2%3Dsa-gp-search%26tab%3Dorganic%26ri%3D17&w=626&h=358&imgurl=img.freepik.com%2Fpremium-photo%2Fglowing-lines-particles-futuristic-digital-circuit-board-cuttingedge-tech-concept_285145-644.jpg&rurl=https%3A%2F%2Fwww.freepik.com%2Ffree-photos-vectors%2Ftechnical-innovation%2F89&size=94KB&p=technical+images&oid=9fb4d8e53aaf049a7c92741bc502a5e7&fr2=sa-gp-search&fr=mcafee&tt=Page+89+%7C+Technical+Innovation+Images+-+Free+Download+on+Freepik&b=0&ni=160&no=17&ts=&tab=organic&sigr=Q2P94ZOpfXPH&sigb=c0502xdLw29c&sigi=3UKmXu0PsSTD&sigt=dt1gsROsWw6W&.crumb=OfgQtPhIzuh&fr=mcafee&fr2=sa-gp-search&type=E210IN1589G0" class="card-img-top" alt="Image">
            <div class="card-body">
                <h5 class="card-title">Bootstrap Card</h5>
                <p class="card-text">
                    This is a simple Bootstrap card example.
                </p>
                <button class="btn btn-primary">Read More</button>
            </div>
        </div>

        <br>

        <h3>Contact Form</h3>
        <form>
            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" class="form-control" placeholder="Enter your name">
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" placeholder="Enter your email">
            </div>

            <button type="submit" class="btn btn-success">
                Submit
            </button>
        </form>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
