<!DOCTYPE html>
<html>
<head>
    <title>Simple Web Page</title>

    <style>
        body{
            font-family: Arial;
            margin: 0;
            padding: 0;
            text-align: center;
            background-color: #f2f2f2;
        }

        header{
            background-color: #333;
            color: white;
            padding: 20px;
        }

        section{
            padding: 40px;
        }

        button{
            background-color: blue;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover{
            background-color: red;
        }
    </style>
</head>

<body>

    <header>
        <h1>Welcome to My Website</h1>
    </header>

    <section>
        <h2>Hello Friends!</h2>

        <p>
            This is a my new webpage using JavaScript.
        </p>

        <button onclick="showMessage()">
            Click Me
        </button>
    </section>

    <script>
        function showMessage(){
            alert("Button Clicked!");
        }
    </script>

</body>
</html>
